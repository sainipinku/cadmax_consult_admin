name: CI/CD Pipeline & VPS Auto Deploy

on:
  push:
    branches:
      - abhishek
      - main
  pull_request:
    branches:
      - abhishek
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: CI (Validate Code, Dependencies, & Build Frontend)
  # -------------------------------------------------------------
  test_and_build:
    name: Code & Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, sqlite, pdo_sqlite, bcmath, curl, zip
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Build Frontend Assets
        run: |
          npm run build
          tar -czf frontend-build.tar.gz -C public/build .

      - name: Upload Frontend Build Archive
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-archive
          path: frontend-build.tar.gz
          retention-days: 1

      - name: Prepare Laravel Environment
        run: |
          cp .env.example .env
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=:memory:/' .env
          php artisan key:generate --ansi

      - name: Validate Scramble API Documentation & Routes
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
        run: |
          php artisan route:cache
          php artisan route:clear
          php artisan scramble:analyze

  # -------------------------------------------------------------
  # Job 2: CD (Zero-Downtime Deploy to VPS Server via SSH & SCP)
  # -------------------------------------------------------------
  deploy:
    name: Zero-Downtime Deploy to VPS
    needs: [test_and_build]
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/abhishek' || github.ref == 'refs/heads/main') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 20

    steps:
      - name: Download Frontend Build Archive
        uses: actions/download-artifact@v4
        with:
          name: frontend-build-archive
          path: .

      - name: Transfer Pre-Built Assets to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "frontend-build.tar.gz"
          target: "/tmp"

      - name: Execute Remote Zero-Downtime Deployment via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            echo "🚀 Starting Zero-Downtime Deployment on $(hostname)..."
            
            # 1. Resolve and navigate to target web directory
            RAW_DIR="${{ secrets.SSH_DEPLOY_PATH }}"
            CLEAN_DIR=$(echo "$RAW_DIR" | sed -e 's/^cd //g' -e "s/['\"]//g" | xargs)

            if [ -n "$CLEAN_DIR" ] && [ -d "$CLEAN_DIR" ]; then
              DEPLOY_DIR="$CLEAN_DIR"
            elif [ -d "/var/www/cadmax_consult_admin" ]; then
              DEPLOY_DIR="/var/www/cadmax_consult_admin"
            elif [ -d "/var/www/html/cadmax_consult_admin" ]; then
              DEPLOY_DIR="/var/www/html/cadmax_consult_admin"
            else
              echo "❌ Error: Target deployment directory not found!"
              echo "Specified: '$CLEAN_DIR'"
              echo "Listing /var/www:"
              ls -la /var/www || true
              exit 1
            fi

            cd "$DEPLOY_DIR"
            echo "📂 Working directory: $(pwd)"

            # 2. Ensure application is active (prevent any lingering 503 maintenance mode)
            php artisan up || true

            # 3. Pull latest code for the active branch dynamically
            TARGET_BRANCH="${{ github.ref_name }}"
            if [ -z "$TARGET_BRANCH" ] || [ "$TARGET_BRANCH" = "HEAD" ]; then
              TARGET_BRANCH="abhishek"
            fi
            echo "📥 Fetching latest commits for branch '$TARGET_BRANCH' from GitHub..."
            git fetch origin "$TARGET_BRANCH"
            git checkout "$TARGET_BRANCH" 2>/dev/null || git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
            git reset --hard "origin/$TARGET_BRANCH"

            # 4. Install PHP dependencies (Production optimized, fast)
            echo "📦 Installing Composer dependencies..."
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

            # 5. Atomically unpack pre-compiled frontend assets (No npm install or build on VPS!)
            TAR_FILE=""
            if [ -f "/tmp/frontend-build.tar.gz" ]; then
              TAR_FILE="/tmp/frontend-build.tar.gz"
            elif [ -f "/tmp/dist/frontend-build.tar.gz" ]; then
              TAR_FILE="/tmp/dist/frontend-build.tar.gz"
            fi

            if [ -n "$TAR_FILE" ] && [ -f "$TAR_FILE" ]; then
              echo "🎨 Deploying pre-compiled frontend assets..."
              rm -rf public/build_new
              mkdir -p public/build_new
              tar -xzf "$TAR_FILE" -C public/build_new
              rm -f "$TAR_FILE"
              
              # Atomic directory swap so active web visitors never hit 404 for assets
              rm -rf public/build_old
              [ -d public/build ] && mv public/build public/build_old
              mv public/build_new public/build
              rm -rf public/build_old
            else
              echo "ℹ️ No new frontend archive found in /tmp; keeping existing build."
            fi

            # 6. Run database migrations safely
            echo "🗄️ Running database migrations..."
            php artisan migrate --force --no-interaction
            php artisan migrate:status || true

            # 6b. Seed permissions and assign default access for Super Admin
            echo "🌱 Running permission & super admin seeders..."
            php artisan db:seed --class=SuperAdminPermissionSeeder --force --no-interaction || true
            php artisan db:seed --class=FuelPermissionSeeder --force --no-interaction || true
            php artisan db:seed --class=AttendancePermissionSeeder --force --no-interaction || true

            # 7. Optimize & cache config, routes, views
            echo "⚡ Clearing and caching Laravel configuration..."
            php artisan config:cache
            php artisan route:cache || { echo "⚠️ Route cache failed — clearing route cache to allow normal dynamic routing"; php artisan route:clear; }
            php artisan view:cache

            # 8. Restart queue workers (if any)
            echo "🔄 Restarting queue workers..."
            php artisan queue:restart || true

            # 9. Gracefully reload PHP-FPM for instant zero-downtime OPcache refresh
            echo "⚡ Gracefully reloading PHP-FPM..."
            (sudo systemctl reload php8.4-fpm || sudo systemctl reload php-fpm || sudo systemctl reload php8.3-fpm || sudo service php8.4-fpm reload) || true

            # 10. Set appropriate file permissions
            echo "🔒 Ensuring correct directory permissions..."
            chown -R www-data:www-data storage bootstrap/cache public/build || true
            chmod -R 775 storage bootstrap/cache public/build || true

            # 11. Confirm application is up and running
            php artisan up || true

            echo "✅ Zero-Downtime Deployment completed successfully in seconds!"
